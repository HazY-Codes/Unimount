<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="UniMount - KernelSU Metamodule">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E222A"/>
      <stop offset="100%" stop-color="#282E3A"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="78%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#818CF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Card Canvas -->
  <rect x="1" y="1" width="838" height="238" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="1" width="838" height="238" rx="20" fill="url(#accentGlow)"/>

  <!-- Subtle Horizontal Rule & Technical Accents -->
  <line x1="0" y1="128" x2="840" y2="128" stroke="url(#hairline)" stroke-width="1"/>
  <rect x="44" y="42" width="4" height="156" rx="2" fill="url(#accentBar)" opacity="0.9"/>

  <!-- Geometric Mount-Layer Emblem (Left) -->
  <g transform="translate(88, 74)" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="46,6 88,28 46,50 4,28" fill="#38BDF8" fill-opacity="0.14"/>
    <polyline points="4,46 46,68 88,46" stroke="#7DD3FC" opacity="0.9"/>
    <polyline points="4,64 46,86 88,64" stroke="#818CF8" opacity="0.75"/>
  </g>

  <!-- Top Right Version / Safety Tag -->
  <text x="794" y="46" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="2.2" fill="#7DD3FC" opacity="0.95">
    KNOX 0x0 SAFE · v2.5.0
  </text>

  <!-- Main Title & Subtitle -->
  <text x="794" y="114" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.5" fill="#F8FAFC">
    UniMount
  </text>
  <text x="794" y="156" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace" font-size="16" letter-spacing="1.4" fill="#94A3B8">
    KernelSU Metamodule &amp; Directory Mirror Engine
  </text>

  <!-- Bottom Right Minimal Footer Meta -->
  <text x="794" y="204" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace" font-size="11.5" letter-spacing="1.2" fill="#94A3B8" opacity="0.85">
    SELINUX MIRRORED · SOFT-REBOOT READY · BUILT FOR UNIROOT
